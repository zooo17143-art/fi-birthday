:root{
  --bg:#070503;
  --surface:#120d08;
  --surface-2:#1c150d;
  --gold:#d4af37;
  --gold-light:#f3d67c;
  --gold-deep:#9a741f;
  --champagne:#f6e7c1;
  --pink:#f2b8c6;
  --pink-deep:#c66a82;
  --cream:#fff8e7;
  --ink:#17110a;
  --text:#fff8e7;
  --muted:#cdbf9f;
  --line:rgba(212,175,55,.42);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#050403;
    --surface:#120d08;
    --text:#fff8e7;
  }
}

*{
  box-sizing:border-box;
}

html{
  background:var(--bg);
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Amiri', serif;
  overflow-x:clip;
}

.font-display{
  font-family:'Aref Ruqaa','Amiri',serif;
}

.font-latin{
  font-family:'Cormorant Garamond','Playfair Display',serif;
}

.font-arabic{
  font-family:'Amiri',serif;
}

.gold-text{
  background:linear-gradient(100deg,#8a6416 0%,#d4af37 22%,#fff3b0 42%,#f3d67c 58%,#b98a24 76%,#fff0a8 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:drop-shadow(0 3px 18px rgba(212,175,55,.28));
}

.gold-btn{
  background:linear-gradient(135deg,#f7e39b 0%,#d4af37 42%,#9a741f 78%,#e8c96a 100%);
  color:#241a05;
  box-shadow:0 14px 40px rgba(212,175,55,.35), inset 0 1px 0 rgba(255,255,255,.75);
  transition:transform .25s ease, box-shadow .25s ease, filter .25s ease;
}

.gold-btn:hover{
  transform:translateY(-2px);
  filter:brightness(1.06);
  box-shadow:0 18px 48px rgba(212,175,55,.45), inset 0 1px 0 rgba(255,255,255,.8);
}

.gold-btn:active{
  transform:translateY(1px) scale(.99);
}

.ghost-btn{
  border:1px solid var(--line);
  color:var(--champagne);
  background:rgba(255,248,231,.04);
  transition:.25s;
}

.ghost-btn:hover{
  background:rgba(212,175,55,.12);
}

.hairline{
  height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}

.ornament{
  letter-spacing:.28em;
}

.silk{
  background:
    radial-gradient(ellipse 70% 45% at 50% 0%, rgba(212,175,55,.22), transparent 65%),
    radial-gradient(ellipse 55% 40% at 85% 90%, rgba(198,106,130,.16), transparent 60%),
    linear-gradient(180deg,#0b0805,#070503);
}

.velvet{
  background:
    radial-gradient(circle at 18% 18%, rgba(212,175,55,.16), transparent 34%),
    radial-gradient(circle at 82% 72%, rgba(242,184,198,.12), transparent 35%),
    linear-gradient(145deg,#15100a,#0a0704);
}

.cream-paper{
  background:linear-gradient(160deg,#fffdf4,#fff2cf 58%,#f7e5ae);
  color:#231a08;
  box-shadow:0 28px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(212,175,55,.55), inset 0 0 0 8px rgba(255,255,255,.35), inset 0 0 40px rgba(212,175,55,.12);
}

@keyframes descend{
  0%{
    transform:translateY(-110%);
    opacity:0;
  }

  55%{
    opacity:1;
  }

  100%{
    transform:translateY(0);
    opacity:1;
  }
}

@keyframes curtainDown{
  from{
    transform:translateY(-102%);
  }

  to{
    transform:translateY(0);
  }
}

@keyframes riseIn{
  from{
    transform:translateY(28px);
    opacity:0;
  }

  to{
    transform:translateY(0);
    opacity:1;
  }
}

@keyframes fadeIn{
  from{
    opacity:0;
  }

  to{
    opacity:1;
  }
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0) rotate(0deg);
  }

  50%{
    transform:translateY(-10px) rotate(2deg);
  }
}

@keyframes sparkle{
  0%,100%{
    transform:scale(.55);
    opacity:.25;
  }

  50%{
    transform:scale(1.25);
    opacity:1;
  }
}

@keyframes fall{
  0%{
    transform:translateY(-8vh) translateX(0) rotate(0deg);
    opacity:0;
  }

  12%{
    opacity:1;
  }

  100%{
    transform:translateY(108vh) translateX(28px) rotate(220deg);
    opacity:0;
  }
}

@keyframes shimmer{
  0%{
    background-position:0% 50%;
  }

  100%{
    background-position:200% 50%;
  }
}

@keyframes langIn{
  0%{
    transform:translateY(22px) scale(.97);
    opacity:0;
    filter:blur(4px);
  }

  100%{
    transform:translateY(0) scale(1);
    opacity:1;
    filter:blur(0);
  }
}

@keyframes pulseSoft{
  0%,100%{
    transform:scale(1);
    opacity:.75;
  }

  50%{
    transform:scale(1.08);
    opacity:1;
  }
}

@keyframes envelopeGlow{
  0%,100%{
    box-shadow:0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(212,175,55,.55);
  }

  50%{
    box-shadow:0 24px 70px rgba(212,175,55,.25), 0 0 0 1px rgba(212,175,55,.9);
  }
}

.animate-descend{
  animation:descend 1.8s cubic-bezier(.2,.8,.2,1) both;
}

.animate-curtain{
  animation:curtainDown 1.5s cubic-bezier(.2,.8,.2,1) both;
}

.animate-rise{
  animation:riseIn .9s ease both;
}

.animate-fade{
  animation:fadeIn 1s ease both;
}

.animate-lang{
  animation:langIn .55s ease both;
}

.animate-floaty{
  animation:floaty 5s ease-in-out infinite;
}

.animate-pulse-soft{
  animation:pulseSoft 2.2s ease-in-out infinite;
}

.shimmer-line{
  background-size:200% auto;
  animation:shimmer 3.5s linear infinite;
}

.sparkle-dot{
  animation:sparkle 2.4s ease-in-out infinite;
}

input{
  outline:none;
}

input:focus{
  border-color:var(--gold) !important;
  box-shadow:0 0 0 3px rgba(212,175,55,.18);
}

.hover\:bg-white\/50:hover{
  background-color: rgb(255 255 255 / 0.5);
}

.disabled\:opacity-60:disabled{
  opacity: 0.6;
}

@media (min-width: 640px){
  .sm\:min-h-\[180px\]{
    min-height: 180px;
  }

  .sm\:w-20{
    width: 5rem;
  }

  .sm\:w-auto{
    width: auto;
  }

  .sm\:min-w-\[360px\]{
    min-width: 360px;
  }

  .sm\:items-center{
    align-items: center;
  }

  .sm\:px-10{
    padding-left: 2.5rem;
    padding-right: 2.5rem;
  }

  .sm\:px-9{
    padding-left: 2.25rem;
    padding-right: 2.25rem;
  }

  .sm\:py-10{
    padding-top: 2.5rem;
    padding-bottom: 2.5rem;
  }

  .sm\:py-14{
    padding-top: 3.5rem;
    padding-bottom: 3.5rem;
  }
}
